function esc(s) {

  var d = document.createElement("div");
  d.textContent = s;

}

function getItemById(id) {
  for (var i = 0; i < T.length; i++) {
    if (T[i].id === id) return { item: T[i], index: i };
  }
  return { item: T[0], index: 0 };
}

function norm(t) {
  return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function realizarBuscaGlobal(query) {
  var q = norm(query.trim());
  if (!q) return [];
  
  var resultados = [];

  for (var i = 1; i < T.length; i++) {
    var item = T[i];
    var icon = SECTION_ICONS[item.id] || "fa-folder";

    if (norm(item.t).indexOf(q) > -1 || norm(item.d).indexOf(q) > -1 || norm(item.o).indexOf(q) > -1) {
      resultados.push({ itemIndex: i, subIndex: -1, pasta: item.t, titulo: item.t, trecho: item.d || item.o, icon: icon });
    }

    (item.sec || []).forEach(function(sec) {
      var textoSec = (sec.t || "") + " " + (sec.tx || "") + " " + (sec.lk || "");
      if (sec.l) textoSec += " " + sec.l.join(" ");
      if (sec.p) textoSec += " " + sec.p.join(" ");
      if (sec.pa) textoSec += " " + sec.pa.join(" ");
      if (sec.tb) {
        textoSec += " " + sec.tb.h.join(" ");
        sec.tb.r.forEach(function(row) { textoSec += " " + row.join(" "); });
      }

      if (norm(textoSec).indexOf(q) > -1) {
        resultados.push({
          itemIndex: i,
          subIndex: -1,
          pasta: item.t,
          titulo: sec.t || item.t,
          trecho: sec.tx || sec.lk || "Conteúdo localizado dentro da seção.",
          icon: icon
        });
      }
    });

    (item.sub || []).forEach(function(subItem, sIdx) {
      if (norm(subItem.t).indexOf(q) > -1 || norm(subItem.c).indexOf(q) > -1) {
        resultados.push({
          itemIndex: i,
          subIndex: sIdx,
          pasta: item.t + " > Modelos de Texto",
          titulo: subItem.t,
          trecho: subItem.c.substring(0, 90) + "...",
          icon: icon
        });
      }
    });
  }

  return resultados;
}

        var calcularTabela = function() {
      var r = document.getElementById("cr");
      var t = String(cv.value).trim();
      if (t.indexOf(",") > -1) t = t.replace(/\./g, "").replace(",", ".");
      var v = parseFloat(t);

      if (!(v > 0)) {
        r.innerHTML = "";
        return;
      }

      var fmt = function(n) {
        return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };

      // Coeficientes para parcelamento com juros (quando fora da política)
      var coeficientesComJuros = {
        1: 1.0,
        2: 1.020000,
        3: 1.030000,
        4: 1.037774,
        5: 1.045445,
        6: 1.071147,
        7: 1.081575,
        8: 1.115736,
        9: 1.129110,
        10: 1.172312
      };

      var h2 = `
        <div class="overflow-x-auto rounded-lg border border-[var(--border-color)] shadow-sm max-w-2xl bg-[var(--card-bg)]">
          <table class="w-full text-center text-sm border-collapse">

                <th class="p-2.5 border-r border-[var(--border-color)]">VALOR PARCELA</th>
                <th class="p-2.5 border-r border-[var(--border-color)]">TOTAL</th>
                <th class="p-2.5">STATUS / REGRA</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-[var(--border-color)] font-medium">
      `;

      for (var n = 1; n <= 10; n++) {
        var parcelaBruta = v / n;
        var dentroPolitica = true;
        var motivo = "";

        // Regras da Política HMV:
        // - Até 8x no cartão.
        // - 1x a 3x: valor mínimo R$ 250,00 por parcela.
        // - 4x a 8x: valor mínimo R$ 500,00 por parcela.
        // - Acima de 8x: fora da política.
        if (n <= 3) {
          if (parcelaBruta < 250) {
            dentroPolitica = false;
            motivo = "Mínimo R$ 250,00 por parcela";
          }
        } else if (n <= 8) {
          if (parcelaBruta < 500) {
            dentroPolitica = false;
            motivo = "Mínimo R$ 500,00 por parcela";
          }
        } else {
          dentroPolitica = false;
          motivo = "Máximo 8x na política";
        }

        // Se estiver dentro da política e até 8x => sem juros (coef = 1.0).
        // Se estiver fora da política => aplica juros (coeficiente com juros).
        var coef = dentroPolitica ? 1.0 : coeficientesComJuros[n];
        var total = v * coef;
        var parcela = total / n;

        var tagStatus = "";
        var rowBg = "";

        if (dentroPolitica) {
          rowBg = "hover:bg-emerald-500/10 text-[var(--text-main)]";
          tagStatus = `<span class="inline-flex items-center gap-1 text-xs font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-500/15 px-2 py-0.5 rounded"><i class="fa-solid fa-circle-check text-[10px]"></i> Sem juros</span>`;
        } else {
          rowBg = "hover:bg-amber-500/10 text-[var(--text-main)]";
          var txtJuros = coef > 1.0 ? "Com juros" : "Sem juros";
          tagStatus = `<span class="inline-flex items-center gap-1 text-xs font-bold text-amber-600 dark:text-amber-400 bg-amber-500/15 px-2 py-0.5 rounded" title="${motivo}"><i class="fa-solid fa-triangle-exclamation text-[10px]"></i> Fora da política (${txtJuros})</span>`;
        }

        h2 += `
          <tr class="${rowBg} transition-colors">
            <td class="p-2.5 border-r border-[var(--border-color)] font-bold">${n}X</td>
            <td class="p-2.5 border-r border-[var(--border-color)] font-semibold">R$ ${fmt(parcela)}</td>
            <td class="p-2.5 border-r border-[var(--border-color)]">R$ ${fmt(total)}</td>
            <td class="p-2.5 text-center">${tagStatus}</td>
          </tr>
        `;
      }

      h2 += `</tbody></table></div>`;
      r.innerHTML = h2;
    };
    cv.oninput = calcularTabela;
    calcularTabela();
  }
}

function copiar(btn) {
  var prev = btn.previousElementSibling;
  var text = prev ? prev.textContent : "";
  var origHtml = btn.innerHTML;

  function setCopied() {
    btn.innerHTML = `<i class="fa-solid fa-check text-emerald-500"></i> Copiado!`;
    setTimeout(function() {
      btn.innerHTML = origHtml;
    }, 1800);
  }

  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      setCopied();
    } catch (e) {}
    document.body.removeChild(ta);
  }

  try {
    navigator.clipboard.writeText(text).then(setCopied, fallback);
  } catch (e) {
    fallback();
  }
}

function go(i, push) {
  cur = i;
  sub = -1;
  show();
  if (push) {
    try {
      location.hash = T[i].id;
    } catch (e) {}
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function fromHash() {
  var h = "";
  try {
    h = location.hash.replace("#", "");
  } catch (e) {}
  go(idx(h), false);
}

function idx(id) {
  for (var i = 0; i < T.length; i++) {
    if (T[i].id === id) return i;
  }
  return 0;
}

function toggleTheme() {
  var isDark = document.documentElement.classList.toggle('dark');
  var themeIcon = document.getElementById("themeIcon");
  var themeText = document.getElementById("themeText");

  if (isDark) {
    themeIcon.className = "fa-solid fa-sun";
    themeText.textContent = "Claro";
    localStorage.setItem("theme", "dark");
  } else {
    themeIcon.className = "fa-solid fa-moon";
    themeText.textContent = "Escuro";
    localStorage.setItem("theme", "light");
  }
}

(function initTheme() {
  var saved = localStorage.getItem("theme");
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === "dark" || (!saved && prefersDark)) {
    document.documentElement.classList.add('dark');
    document.getElementById("themeIcon").className = "fa-solid fa-sun";
    document.getElementById("themeText").textContent = "Claro";
  } else {
    document.documentElement.classList.remove('dark');
    document.getElementById("themeIcon").className = "fa-solid fa-moon";
    document.getElementById("themeText").textContent = "Escuro";
  }
})();

window.addEventListener("hashchange", fromHash);
fromHash();
</script>
